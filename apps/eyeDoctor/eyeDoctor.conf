# Eye Doctor Configuration File
# This file configures the eye doctor application for DM optimization

[eyedoctor]
# Available DM Devices
availableDMs = wooferModes,ncpcModes,tweeterModes,kiloModes

# Selected DM Device
selectedDM = tweeterModes

# Available Wavefront Sensing Cameras
availableCameras = camsci1,camsci2,camlowfs,camtip,camflowf

# Selected Camera for Wavefront Sensing
selectedCamera = camlo_sim

# Mode Range Specification
startModeIndex = 1
endModeIndex = 5

# Algorithm Parameters
psfCoreRadiusPixels = 5.0
searchRange = 0.1
nSteps = 20
nRepeats = 3
nClusterRepeats = 1
nSeqRepeat = 1
nImages = 1
cenX = 50
cenY = 50
skipFrames = 0
resetToZero = false
ignoreFocus = false

# Optimization Parameters
targetLatency = 1000.0
latencyTolerance = 100.0
autoOptimizeLatency = true
maxIterations = 100
convergenceThreshold = 1e-6
adaptiveStepSize = 0.1

# dmWavefrontControl framework configuration
# All DM-specific parameters should be configured here
[dmWavefrontControl]
# Amplitude of DM pokes (volts or microns)
dmPokeAmplitude = 0.1

# Delay between DM commands in microseconds (CACAO mlat parameter)
dmPokeDelay = 10000

# DM metadata file (leave empty to use config parameters below instead)
metadata_file = 

# DM Physical Parameters (loaded from config if metadata_file is empty)
deviceName = dm11disp05   # DM device/shared memory name (CACAO shmim name)
wfsShmimName = camlo_sim  # WFS camera shared memory name
wfsDarkShmimName =        # Optional dark frame shmim
wfsCameraName = camlo_sim  # WFS camera device name
actuator_spacing = 0.4    # Actuator spacing in mm
max_stroke = 5.0          # Maximum stroke in microns
numActuators = 2500       # Number of actuators (50x50 = 2500)
gridWidth = 50            # Actuator grid width
gridHeight = 50           # Actuator grid height
dmType = "Boston Micromachines"  # DM type/manufacturer
deadActuators =          # Comma-separated list of dead actuator indices

# Optional file paths (leave empty if not used)
couplingMatrix =          # Path to coupling matrix file (optional)
actuatorGains =           # Path to actuator gains file (optional)
actuatorLimits =          # Path to actuator limits file (optional)

# Modeset Configuration (REQUIRED)
# Modeset files contain the mode shapes in FITS format (3D cube: [modes][height][width])
# Each plane is a mode pattern (e.g., Zernike modes, actuator pokes)
# Example: /opt/MagAOX/calib/dm/dmtweeter/zernike_modes.fits
modesets = /opt/MagAOX/calib/dm/test_sim/test_modeset_50x50_36modes.fits  # Comma-separated list of modeset FITS file paths (REQUIRED)
modeset_names = test_zernike                     # Comma-separated list of names for each modeset (e.g., "zernike,hadamard")
default_modeset = test_zernike                  # Name of the default modeset to use (e.g., "zernike")
modes_to_optimize =                              # Comma-separated list of modes to optimize (format: "modeset:mode", e.g., "zernike:1,zernike:2")
