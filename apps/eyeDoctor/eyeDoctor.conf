# Eye Doctor Configuration File
# This file configures the eye doctor application for DM optimization

[eyedoctor]
# DM modes to use for optimization
dmModes = dm01disp06

# Camera shmim to target
shmim = camflowf

# PSF core radius in pixels
psfCoreRadiusPixels = 5.0

# Modes to optimize (comma-separated list)
modesToOptimize = 1,2,3,4,5

# Search range for optimization
searchRange = 0.1

# Delay between DM commands in microseconds (CACAO mlat parameter)
dmPokeDelay = 10000

# List of available cameras
availableCameras = camflowf,camllowfs,camsci,camsci2

# WFS camera configuration
[wfscam]
# INDI device name of the WFS camera
camDevName = wfscam

# Semaphore wait time for the wfs loop start signal
loopSemWait = 1.5

# Semaphore wait time for the image availability signal
imageSemWait = 0.5

# Dark frame configuration
[wfsdark]
# Dark frame shmim name
shmimName = wfsdark

# Poke center configuration
[pokecen]
# The dm channel to use for pokes
dmChannel = dm01disp06

# The x-coordinates of the actuators to poke
pokeX = 64

# The y-coordinates of the actuators to poke
pokeY = 64

# The poke amplitude, in DM command units
pokeAmp = 0.1

# The time to sleep for the DM command to be applied, in microseconds
dmSleep = 10000

# The number of poke images to average
nPokeImages = 5

# The number of poke sequences to average
nPokeAverage = 10
