# DM Metadata Configuration File
# This file contains information about the deformable mirror

[dm_info]
# DM device name
device_name = dm01disp06

# Number of actuators
num_actuators = 4096

# Actuator grid dimensions
grid_width = 64
grid_height = 64

# Actuator spacing in mm
actuator_spacing = 0.4

# Maximum stroke in microns
max_stroke = 5.0

# DM type
dm_type = "Boston Micromachines"

# Dead actuators (comma-separated list of actuator indices)
# Example: dead_actuators = 0,1,2,4095
dead_actuators = 

# Actuator coupling matrix file (optional)
# coupling_matrix = coupling.fits

# Actuator gain file (optional)
# actuator_gains = gains.fits

# Actuator limits file (optional)
# actuator_limits = limits.fits

