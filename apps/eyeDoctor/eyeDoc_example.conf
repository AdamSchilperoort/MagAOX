# eyeDoc Configuration File
# Example configuration for eyeDoctor wavefront optimization application

[eyedoctor]

#=============================================================================
# DM CONTROL MODE CONFIGURATION
#=============================================================================

# Control Mode: "magaox" or "cacao"
# - "magaox": Interface with MagAOX DM applications (dmwoofer, dmtweeter, etc.)
# - "cacao": Interface directly with CACAO shared memory streams
dmControlMode = magaox

#-----------------------------------------------------------------------------
# MagAOX App Mode Configuration (used when dmControlMode = "magaox")
#-----------------------------------------------------------------------------

# List of available MagAOX DM applications
availableDMApps = dmwoofer,dmncpc,dmtweeter,dmkilo

# Selected MagAOX DM app (must be one from availableDMApps)
selectedDMApp = dmkilo

#-----------------------------------------------------------------------------
# CACAO Shmim Mode Configuration (used when dmControlMode = "cacao")
#-----------------------------------------------------------------------------

# List of available CACAO DM shared memory streams
availableDMShmims = dm00disp,dm01disp,dm02disp,dm00disp06

# Selected CACAO DM shmim (must be one from availableDMShmims)
selectedDMShmim = dm00disp06

#-----------------------------------------------------------------------------
# Manual Overrides (optional - overrides mode-based resolution)
#-----------------------------------------------------------------------------

# Uncomment to manually specify DM device name (overrides mode resolution)
#dmDeviceName = dmkilo

# Uncomment to manually specify DM shmim name (overrides mode resolution)
#dmShmimName = dm00disp

# Uncomment to specify full device/channel name
#deviceName = dm00disp06

#=============================================================================
# CAMERA CONFIGURATION
#=============================================================================

# List of available wavefront sensing cameras
availableCameras = camsci1,camsci2,camlowfs,camtip,camflowf,camlo_sim

# Selected camera for wavefront sensing
selectedCamera = camlo_sim

# WFS camera shared memory name (for image collection)
wfsShmimName = camlo_sim

# WFS camera device name (for MagAOX app interface)
wfsCameraName = camlo_sim

# Optional: Dark frame shmim for background subtraction
wfsDarkShmimName =

#=============================================================================
# DM METADATA
#=============================================================================

# Number of actuators in the DM
numActuators = 1156

# Actuator grid dimensions
gridWidth = 34
gridHeight = 34

# DM type/manufacturer
dmType = "Boston Micromachines"

# Actuator spacing (mm)
actuator_spacing = 0.4

# Maximum stroke (microns)
max_stroke = 5.0

# Dead actuators (comma-separated indices)
deadActuators =

# Optional: Path to coupling matrix file
couplingMatrix =

# Optional: Path to actuator gains file
actuatorGains =

# Optional: Path to actuator limits file
actuatorLimits =

#=============================================================================
# MODESET CONFIGURATION
#=============================================================================

# Comma-separated list of modeset FITS files
modesets = /opt/MagAOX/calib/dm/kilo/zernike_modes_kilo_34x34_36modes.fits

# Comma-separated names for each modeset (must match number of modeset files)
modeset_names = zernike

# Default modeset to use
default_modeset = zernike

#=============================================================================
# MODE OPTIMIZATION SPECIFICATION
#=============================================================================

# Starting mode index (0-based)
startModeIndex = 0

# Ending mode index (inclusive)
endModeIndex = 35

#=============================================================================
# ALGORITHM PARAMETERS
#=============================================================================

# PSF core radius for intensity measurement (pixels)
psfCoreRadiusPixels = 5.0

# Search range for grid optimization (microns)
searchRange = 1.0

# Number of grid points to sample
nSteps = 20

# Number of measurement sweeps per mode
nRepeats = 3

# Number of times to repeat a cluster of modes
nClusterRepeats = 1

# Number of times to repeat full sequence
nSeqRepeat = 1

# Number of images to collect per measurement
nImages = 10

# PSF centroid location (pixels)
cenX = 17
cenY = 17

# Number of frames to skip before measurement
skipFrames = 0

# Reset mode to zero before optimization (ignore current value)
resetToZero = false

# Skip focus mode during optimization
ignoreFocus = false

#=============================================================================
# OPTIMIZATION PARAMETERS
#=============================================================================

# Target latency between DM update and camera frame (microseconds)
targetLatency = 1000.0

# Tolerance around target latency (microseconds)
latencyTolerance = 100.0

# Automatically optimize latency during operation
autoOptimizeLatency = false

# Maximum optimization iterations
maxIterations = 100

# Convergence threshold
convergenceThreshold = 1e-6

# Adaptive step size during optimization
adaptiveStepSize = 0.1

